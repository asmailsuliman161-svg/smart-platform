<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<title>التمارين</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>تمارين الحاسب والرياضيات</h2>
</header>

<div class="container">

    <!-- زر بدء الاختبار -->
    <button onclick="startQuiz()">بدء اختبار جديد</button>

    <br><br>

    <h3 id="question"></h3>

    <input type="text" id="answer" placeholder="اكتب الإجابة">

    <br><br>

    <button onclick="checkAnswer()">تحقق</button>

    <p id="result"></p>

    <h3 id="score"></h3>

</div>

<script src="script.js"></script>

</body>
</html>
